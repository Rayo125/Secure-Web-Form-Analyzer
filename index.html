<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Web Form Analyzer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Fullscreen Video Background -->
<div class="video-background">
  <video autoplay muted loop id="bgVideo">
    <source src="assets/analysis.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</div>

<!-- Content on top of video -->
<div class="content">
  <h1>Secure Web Form Analyzer</h1>

  <!-- Alerts -->
  <div id="alertsContainer"></div>

  <!-- Wrap forms in row -->
  <div class="forms-row">
    <!-- Test Form 1-->
    <form id="testForm1" class="animated-form">
      <h2>Test Form Input #1</h2>
      <label>Field Name:</label>
      <input type="text" id="testField1" placeholder="Enter any text" required>
      
      <label>Input Value:</label>
      <input type="text" id="testValue1" placeholder="Enter value to test" required>
      
      <button type="submit">Submit</button>
    </form>

    <!-- Test Form 2-->
    <form id="testForm2" class="animated-form">
      <h2>Test Form Input #2</h2>
      <label>Field Name:</label>
      <input type="text" id="testField2" placeholder="Enter any text" required>
      
      <label>Input Value:</label>
      <input type="text" id="testValue2" placeholder="Enter value to test" required>
      
      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<script src="formAnalyzer.js"></script>
<script>
  // Fade-in animation for forms
  document.querySelectorAll('.animated-form').forEach((form, index) => {
    form.style.opacity = 0;
    form.style.transform = "translateY(30px)";
    setTimeout(() => {
      form.style.transition = "all 0.6s ease";
      form.style.opacity = 1;
      form.style.transform = "translateY(0)";
    }, 200 * index);
  });
</script>

</body>
</html>
